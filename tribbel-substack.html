<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tribble | App</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }
    body {
      background: radial-gradient(circle at 20% 20%, #ecf5e3, #ecf5e3);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
      position: relative;
    }
    h1 {
      font-size: 2.4rem;
      font-weight: 700;
      background: #000000;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
      animation: fadeInDown 1.2s ease forwards;
    }
    p {
      font-size: 1.1rem;
      color: #6d6c6c;
      max-width: 320px;
      line-height: 1.7;
      animation: fadeInUp 1.3s ease forwards;
    }
    .logo {
      width: 80px;
      border-radius: 20px;
      margin-bottom: 25px;
      opacity: 0;
      animation: fadeIn 1.3s ease forwards;
    }
    .input{
            background: #f8f8f8;
      border: 2px solid #cceeaa;
      border-radius: 70px;
      padding: 18px;
      width: 400px;
      max-width: 90%;
      text-align: center;
      box-shadow: 0 0 20px rgba(0, 255, 90, 0.1);
      font-size: 16px;
      transition: 0.3s;
      z-index: 1;
      position: relative;
    }
    .btn {
      margin-top: 25px;
      padding: 12px 24px;
      background: #0077b6;
      border: none;
      border-radius: 30px;
      color: white;
      cursor: pointer;
      font-weight: 600;
      transition: 0.3s;
      font-size: 1rem;
      animation: fadeInUp 1.5s ease forwards;
    }
    .btn:hover {
      background: #00b4d8;
      transform: translateY(-3px);
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    footer {
      font-size: 0.8rem;
      color: #666;
      margin-top: 30px;
    }

    @media (max-width: 400px) {
      h1 { font-size: 1.8rem; }
      p { font-size: 1rem; max-width: 280px; }
      .btn { padding: 10px 20px; font-size: 0.9rem; }
    }
  </style>
</head>
<body>
  <img src="img/logo.png" alt="Tribble Logo" class="logo">

  <h1>Updates</h1>
  <p>connecting like-minded <br>people and communities IRL</p> <br>
  <p>By Tribbel.Over 700 Subscribes</p>

  <input type="email" placeholder="Type your email" class="input">
  <button onclick="window.location.href='index.html'" class="btn">Subscribe</button>

  <footer>By subscribbing, i agree to substack's <span style="text-decoration: underline;">Terms of Use</span> and <br> acknowledge its <span style="text-decoration: underline;">information collection notice 
  </span>and <span style="text-decoration: underline;">Privacy Policy</span> <br><br> <h4>No Thanks</h4></footer>

  <script>
    if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
      console.log("يبدو أنك تستخدم موبايل!");
    }
  </script>
</body>
</html>
